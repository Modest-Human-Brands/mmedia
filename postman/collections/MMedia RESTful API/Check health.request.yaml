$kind: http-request
description: Returns service status, version, build time and node name.
url: '{{base_url}}/health'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Body has status, version, buildTime and node", function () {
          const body = pm.response.json();
          pm.expect(body.status).to.eql("OK");
          pm.expect(body).to.have.property("version");
          pm.expect(body).to.have.property("buildTime");
          pm.expect(body).to.have.property("node");
      });
    language: text/javascript
order: 2000
