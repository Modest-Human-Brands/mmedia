$kind: http-request
description: Missing x-api-key header returns 401.
url: '{{base_url}}/media/{{media_id}}/metadata'
method: GET
headers:
  X-Org-Id: '{{org_id}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 5000
