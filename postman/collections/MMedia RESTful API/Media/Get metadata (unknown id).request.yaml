$kind: http-request
description: Unknown media id returns 404.
url: '{{base_url}}/media/does-not-exist/metadata'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Body has error message", function () {
          pm.expect(pm.response.json()).to.have.property("error");
      });
    language: text/javascript
order: 3000
