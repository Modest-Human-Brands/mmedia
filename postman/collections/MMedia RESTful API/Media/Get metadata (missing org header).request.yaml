$kind: http-request
description: Missing x-org-id header returns 400.
url: '{{base_url}}/media/{{media_id}}/metadata'
method: GET
headers:
  x-api-key: '{{api_key}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Body has error message", function () {
          pm.expect(pm.response.json()).to.have.property("error");
      });
    language: text/javascript
order: 4000
