$kind: http-request
description: Downloads the processed file from R2 and returns its technical metadata. `media_id` is the processed filename without extension.
url: '{{base_url}}/media/{{media_id}}/metadata'
method: GET
headers:
  x-api-key: '{{api_key}}'
  x-org-id: '{{org_id}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Body has slug, type, thumbnailUrl and size", function () {
          const body = pm.response.json();
          pm.expect(body.slug).to.eql(pm.variables.get("media_id"));
          pm.expect(body.type).to.be.oneOf(["photo", "video", "audio"]);
          pm.expect(body.thumbnailUrl).to.be.a("string");
          pm.expect(body.metadata.size).to.be.above(0);
      });
    language: text/javascript
order: 2000
