$kind: http-request
description: Empty Records array is rejected.
url: '{{base_url}}/webhook/media/uploads'
method: POST
headers:
  x-api-key: '{{api_key}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "Records": []
      }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Body has error message", function () {
          pm.expect(pm.response.json()).to.have.property("error");
      });
    language: text/javascript
order: 2000
