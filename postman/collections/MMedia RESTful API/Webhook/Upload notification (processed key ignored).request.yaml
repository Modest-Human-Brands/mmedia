$kind: http-request
description: Objects outside upload/ (for example our own processed/ writes) are ignored and never queued.
url: '{{base_url}}/webhook/media/uploads'
method: POST
headers:
  x-api-key: '{{api_key}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "Records": [
          {
            "s3": {
              "bucket": {
                "name": "bucket-dev-media-origin"
              },
              "object": {
                "key": "processed/red-cat-pictures-3/test-2/photo-0003-0008-0001-001.jpg",
                "size": 1886553
              }
            }
          }
        ]
      }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 202", function () {
          pm.response.to.have.status(202);
      });

      pm.test("Body is flagged as ignored", function () {
          pm.expect(pm.response.json().ignored).to.eql(true);
      });
    language: text/javascript
order: 3000
